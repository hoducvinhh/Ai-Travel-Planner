name: travel_planner
description: AI Travel Planner mobile app - Flutter application for trip planning with AI assistance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0

  # HTTP & API
  dio: ^5.4.0
  http: ^1.2.0

  # Navigation
  go_router: ^14.2.0

  # UI Components
  lucide_icons_flutter: ^1.1.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # Storage
  sqflite: ^2.3.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Chat & Markdown
  flutter_markdown: ^0.6.0

  # Utilities
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

  # Testing
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  # Assets folders will be added as we create them
  # assets:
  #   - assets/images/
  #   - assets/icons/
