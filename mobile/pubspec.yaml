name: travel_planner
description: AI Travel Planner mobile app - Flutter application for trip planning with AI assistance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0

  # HTTP & API
  dio: ^5.4.0
  http: ^1.2.0

  # Navigation
  go_router: ^14.2.0

  # UI Components
  lucide_icons_flutter: 3.1.24
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # Storage
  sqflite: ^2.3.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Biometric Authentication
  local_auth: ^2.2.0

  # Media & Camera
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Chat & Markdown
  flutter_markdown: ^0.6.0

  # Utilities
  intl: ^0.19.0
  path: ^1.9.0
  freezed_annotation: 3.1.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.5.4
  freezed: 4.0.2
  json_serializable: ^6.9.5

  # Testing
  mockito: ^5.4.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  # Assets folders will be added as we create them
  # assets:
  #   - assets/images/
  #   - assets/icons/
